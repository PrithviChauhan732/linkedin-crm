<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 320px; font-family: -apple-system, sans-serif; background: #f8fafc; color: #1e293b; }

    .header { background: #0a66c2; color: white; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
    .header h1 { font-size: 15px; font-weight: 600; }
    .header .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }

    .section { padding: 12px 16px; border-bottom: 1px solid #e2e8f0; }
    .section-label { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }

    .compose textarea {
      width: 100%; height: 80px; border: 1px solid #cbd5e1; border-radius: 6px;
      padding: 8px; font-size: 13px; resize: none; outline: none;
      font-family: inherit;
    }
    .compose textarea:focus { border-color: #0a66c2; }

    .template-select {
      width: 100%; border: 1px solid #cbd5e1; border-radius: 6px;
      padding: 7px 8px; font-size: 13px; background: white; outline: none;
      margin-bottom: 8px; cursor: pointer;
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 500;
      cursor: pointer; border: none; transition: all 0.15s;
    }
    .btn-primary { background: #0a66c2; color: white; width: 100%; }
    .btn-primary:hover { background: #0858a8; }
    .btn-secondary { background: white; color: #0a66c2; border: 1px solid #0a66c2; }
    .btn-secondary:hover { background: #eff6ff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .stat { background: white; border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px; text-align: center; }
    .stat-value { font-size: 20px; font-weight: 700; color: #0a66c2; }
    .stat-label { font-size: 10px; color: #64748b; margin-top: 2px; }

    .unread-list { max-height: 160px; overflow-y: auto; }
    .unread-item { display: flex; flex-direction: column; padding: 8px 0; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
    .unread-item:last-child { border-bottom: none; }
    .unread-item:hover { background: #f8fafc; }
    .unread-name { font-size: 13px; font-weight: 600; }
    .unread-preview { font-size: 12px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .open-dashboard { text-align: center; padding: 10px 16px; }
    .open-dashboard a { color: #0a66c2; font-size: 12px; text-decoration: none; }
    .open-dashboard a:hover { text-decoration: underline; }

    .status { font-size: 12px; color: #16a34a; padding: 6px 0; text-align: center; display: none; }
  </style>
</head>
<body>

  <div class="header">
    <div class="dot" id="status-dot"></div>
    <h1>LinkedIn CRM</h1>
  </div>

  <!-- Stats -->
  <div class="section">
    <div class="section-label">This Week</div>
    <div class="stats">
      <div class="stat"><div class="stat-value" id="stat-sent">-</div><div class="stat-label">Sent</div></div>
      <div class="stat"><div class="stat-value" id="stat-replied">-</div><div class="stat-label">Replied</div></div>
      <div class="stat"><div class="stat-value" id="stat-unread">-</div><div class="stat-label">Unread</div></div>
    </div>
  </div>

  <!-- Quick Compose -->
  <div class="section compose">
    <div class="section-label">Quick Send</div>
    <select class="template-select" id="template-select">
      <option value="">— or use a saved template —</option>
    </select>
    <textarea id="message-text" placeholder="Type a message..."></textarea>
    <div style="margin-top:8px">
      <button class="btn btn-primary" id="send-btn" disabled>Send to current conversation</button>
    </div>
    <div class="status" id="send-status">✓ Message sent!</div>
  </div>

  <!-- Unread -->
  <div class="section">
    <div class="section-label">Unread Conversations</div>
    <div class="unread-list" id="unread-list">
      <div style="font-size:12px;color:#94a3b8;text-align:center;padding:16px">Loading...</div>
    </div>
  </div>

  <div class="open-dashboard">
    <a href="http://localhost:3000" target="_blank">Open full dashboard →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
