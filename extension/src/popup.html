<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 340px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; font-size: 13px; }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #0a66c2 0%, #1d4ed8 100%);
      color: white; padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header h1 { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
    .header .sub { font-size: 10px; opacity: .7; margin-top: 1px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 6px #4ade80; }
    .dot.offline { background: #f87171; box-shadow: 0 0 6px #f87171; }

    /* ── Context Bar ── */
    #context-bar {
      background: #1e293b; border-bottom: 1px solid #334155;
      padding: 10px 14px; display: none; align-items: flex-start; justify-content: space-between; gap: 8px;
    }
    #context-bar.visible { display: flex; }
    .context-info { min-width: 0; flex: 1; }
    .context-type { font-size: 9px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px; }
    .context-name { font-size: 13px; font-weight: 700; color: #f1f5f9; background: transparent; border: 1px dashed transparent; width: 100%; outline: none; margin-bottom: 2px; }
    .context-name:hover, .context-name:focus { border-color: #475569; background: #0f172a; border-radius: 4px; padding: 2px; margin-left: -2px; }
    .context-sub  { font-size: 10px; color: #94a3b8; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .status-badge { display: inline-block; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-top: 4px; background: #334155; color: #cbd5e1; text-transform: uppercase; }
    .status-badge.connected { background: #065f46; color: #34d399; }
    .status-badge.connection_sent { background: #78350f; color: #fbbf24; }
    
    .save-row { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
    .group-select {
      flex: 1; min-width: 120px; background: #0f172a; border: 1px solid #334155; border-radius: 7px;
      padding: 6px 8px; color: #e2e8f0; font-size: 11px; outline: none; cursor: pointer;
    }
    .save-btn {
      background: #2563eb; border: none; border-radius: 7px;
      padding: 6px 12px; color: white; font-size: 11px; font-weight: 700;
      cursor: pointer; white-space: nowrap; transition: background .15s;
    }
    .save-btn:hover { background: #1d4ed8; }
    .save-btn.saved { background: #059669; }
    
    .action-btn { background: #334155; border: none; border-radius: 7px; padding: 6px 12px; color: #f1f5f9; font-size: 10px; font-weight: 600; cursor: pointer; }
    .action-btn:hover { background: #475569; }
    
    #context-save-status { font-size: 10px; color: #22d3ee; height: 12px; margin-top: 4px; width: 100%; }

    /* ── Tabs ── */
    .tabs { display: flex; background: #0f172a; border-bottom: 1px solid #1e293b; }
    .tab {
      flex: 1; padding: 9px 4px; text-align: center; font-size: 11px; font-weight: 600;
      color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s;
    }
    .tab.active { color: #60a5fa; border-bottom-color: #2563eb; }
    .tab:hover:not(.active) { color: #94a3b8; }

    /* ── Panels ── */
    .panel { display: none; }
    .panel.active { display: block; }

    /* ── Section ── */
    .section { padding: 12px 14px; border-bottom: 1px solid #1e293b; }
    .section-label { font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }

    /* ── Stats ── */
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .stat { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 10px; text-align: center; }
    .stat-value { font-size: 20px; font-weight: 800; color: #60a5fa; }
    .stat-label { font-size: 9px; color: #64748b; margin-top: 2px; text-transform: uppercase; letter-spacing: .04em; }

    /* ── Compose ── */
    .template-select {
      width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 7px;
      padding: 7px 8px; font-size: 12px; color: #e2e8f0; outline: none; margin-bottom: 8px; cursor: pointer;
    }
    textarea {
      width: 100%; height: 76px; background: #1e293b; border: 1px solid #334155;
      border-radius: 7px; padding: 8px; font-size: 12px; resize: none; outline: none;
      font-family: inherit; color: #e2e8f0;
    }
    textarea:focus { border-color: #2563eb; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 14px; border-radius: 7px; font-size: 12px; font-weight: 600;
      cursor: pointer; border: none; transition: all .15s; width: 100%;
    }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .send-status { font-size: 11px; color: #22d3ee; padding: 4px 0; text-align: center; display: none; }

    /* ── Unread list ── */
    .unread-list { max-height: 140px; overflow-y: auto; }
    .unread-item {
      display: flex; flex-direction: column; padding: 8px 0;
      border-bottom: 1px solid #1e293b; cursor: pointer;
    }
    .unread-item:last-child { border-bottom: none; }
    .unread-item:hover .unread-name { color: #60a5fa; }
    .unread-name { font-size: 12px; font-weight: 600; color: #f1f5f9; transition: color .15s; }
    .unread-preview { font-size: 11px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

    /* ── Groups panel ── */
    .groups-list { max-height: 220px; overflow-y: auto; }
    .group-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px solid #1e293b;
    }
    .group-item:last-child { border-bottom: none; }
    .group-dot { width: 8px; height: 8px; border-radius: 50%; shrink: 0; }
    .group-name { font-size: 12px; font-weight: 600; color: #f1f5f9; }
    .group-count { font-size: 10px; color: #64748b; }
    .group-open { font-size: 10px; color: #60a5fa; cursor: pointer; text-decoration: none; }
    .group-open:hover { text-decoration: underline; }

    .new-group-form { display: none; flex-direction: column; gap: 6px; margin-top: 8px; }
    .new-group-form.open { display: flex; }
    .text-input {
      background: #1e293b; border: 1px solid #334155; border-radius: 7px;
      padding: 7px 9px; font-size: 12px; color: #e2e8f0; outline: none; width: 100%;
    }
    .text-input:focus { border-color: #2563eb; }
    .color-row { display: flex; align-items: center; gap: 8px; }
    .color-row input[type=color] { width: 32px; height: 32px; border: 1px solid #334155; border-radius: 6px; cursor: pointer; background: none; padding: 2px; }
    .color-row .text-input { flex: 1; }
    .row-btns { display: flex; gap: 6px; }
    .btn-sm {
      flex: 1; padding: 6px; border-radius: 7px; font-size: 11px; font-weight: 700;
      cursor: pointer; border: none; transition: background .15s;
    }
    .btn-sm-primary { background: #2563eb; color: white; }
    .btn-sm-primary:hover { background: #1d4ed8; }
    .btn-sm-ghost { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
    .btn-sm-ghost:hover { background: #334155; }

    /* ── Footer ── */
    .footer { padding: 10px 14px; border-top: 1px solid #1e293b; text-align: center; }
    .footer a { color: #60a5fa; font-size: 11px; text-decoration: none; font-weight: 600; }
    .footer a:hover { text-decoration: underline; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="dot" id="status-dot"></div>
      <div>
        <h1>WarmDM</h1>
        <div class="sub">LinkedIn Outreach CRM</div>
      </div>
    </div>
  </div>

  <!-- Context Bar — shown when on a profile or company page -->
  <div id="context-bar">
    <div class="context-info" style="width:100%">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div class="context-type" id="ctx-type">Profile</div>
        <div id="ctx-conn-status" class="status-badge" style="display:none;"></div>
      </div>
      <input type="text" class="context-name" id="ctx-name" value="" />
      <div class="context-sub" id="ctx-sub"></div>
      <div class="save-row">
        <select class="group-select" id="ctx-group-select">
          <option value="">— Select Group —</option>
        </select>
        <button class="save-btn" id="ctx-save-btn">Save</button>
        <button class="action-btn" id="ctx-connect-btn" style="display:none;">Set Connected</button>
      </div>
      <div id="context-save-status"></div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" data-tab="home">Home</div>
    <div class="tab" data-tab="groups">Groups</div>
    <div class="tab" data-tab="compose">Compose</div>
  </div>

  <!-- ── HOME PANEL ────────────────────────── -->
  <div class="panel active" id="panel-home">
    <div class="section">
      <div class="section-label">This Week</div>
      <div class="stats">
        <div class="stat"><div class="stat-value" id="stat-sent">-</div><div class="stat-label">Sent</div></div>
        <div class="stat"><div class="stat-value" id="stat-replied">-</div><div class="stat-label">Replied</div></div>
        <div class="stat"><div class="stat-value" id="stat-unread">-</div><div class="stat-label">Unread</div></div>
      </div>
    </div>
    <div class="section">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <div class="section-label" style="margin:0">Unread Conversations</div>
        <button id="sync-ml-btn" class="action-btn" style="padding:4px 8px; font-size:9px;">Sync Chats & ML</button>
      </div>
      <div id="sync-ml-status" style="font-size:9px; color:#34d399; margin-bottom:8px; display:none; text-align:right;"></div>
      <div class="unread-list" id="unread-list">
        <div style="font-size:11px;color:#475569;text-align:center;padding:16px">Loading...</div>
      </div>
    </div>
  </div>

  <!-- ── GROUPS PANEL ──────────────────────── -->
  <div class="panel" id="panel-groups">
    <div class="section">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <div class="section-label" style="margin:0">Your Groups</div>
        <button id="new-group-toggle" class="btn-sm btn-sm-primary" style="width:auto;padding:4px 10px;font-size:10px;">+ New</button>
      </div>

      <!-- New group form -->
      <div class="new-group-form" id="new-group-form">
        <input type="text" class="text-input" id="ng-name" placeholder="Group name (e.g. PM Recruiters)" />
        <div class="color-row">
          <input type="color" id="ng-color" value="#2563eb" />
          <input type="text" class="text-input" id="ng-desc" placeholder="Description (optional)" />
        </div>
        <div class="row-btns">
          <button class="btn-sm btn-sm-primary" id="ng-create-btn">Create Group</button>
          <button class="btn-sm btn-sm-ghost" id="ng-cancel-btn">Cancel</button>
        </div>
        <div id="ng-status" style="font-size:10px;color:#22d3ee;height:12px;"></div>
      </div>

      <div class="groups-list" id="groups-list">
        <div style="font-size:11px;color:#475569;text-align:center;padding:16px">Loading...</div>
      </div>
    </div>
  </div>

  <!-- ── COMPOSE PANEL ─────────────────────── -->
  <div class="panel" id="panel-compose">
    <div class="section">
      <div class="section-label">Quick Send</div>
      <select class="template-select" id="template-select">
        <option value="">— Load a template —</option>
      </select>
      <textarea id="message-text" placeholder="Type a message..."></textarea>
      <div style="margin-top:8px">
        <button class="btn btn-primary" id="send-btn" disabled>Send to current conversation</button>
      </div>
      <div class="send-status" id="send-status">✓ Message sent!</div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <a href="https://warmdm.vercel.app" target="_blank">Open full dashboard →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
